</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="auth" id="auth">
  <div class="auth-box" id="authBox"></div>
</div>
<div class="acct-pop" id="acctPop" hidden></div>
<input type="file" id="acctFile" accept="application/json,.json" hidden>
<script>
/* Comunicador de Entregáveis · login, conta e ligação com o Supabase.
   O app foi feito para a conta do Claude (window.claude). Esta camada entrega a mesma
   interface usando o Supabase, então o resto do app não muda. */
(() => {
const CFG = window.MF_CONFIG || {};
const box = document.getElementById("authBox");
const overlay = document.getElementById("auth");
const pop = document.getElementById("acctPop");
const fileIn = document.getElementById("acctFile");
const SHARED = ["agent", "kb", "product"];
let resolveReady; window.__authReady = new Promise(r => resolveReady = r);
let googleOn = null;
let sb = null, me = null, profile = null, entered = false, entering = false, mode = "login";
const recovering = { on: /type=recovery/.test(location.hash) };

const MARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="6" height="18" rx="2" fill="var(--s4)"/><rect x="9" y="3" width="6" height="12" rx="2" fill="var(--s1)"/><rect x="16" y="3" width="6" height="7" rx="2" fill="var(--ok)"/><path d="M16 16l2.5 2.5L23 14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
const GOOGLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4z"/></svg>';
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $id = id => document.getElementById(id);
const here = () => location.origin + location.pathname;

const ERR = [
  [/invalid login credentials/i, "Email ou senha incorretos."],
  [/already registered|already been registered|user already exists/i, "Já existe uma conta com esse email. Use Entrar."],
  [/password should be at least|at least 6/i, "A senha precisa de pelo menos 6 caracteres."],
  [/email not confirmed/i, "Esse email ainda não foi confirmado. Veja sua caixa de entrada."],
  [/unable to validate email|invalid email|email address .* invalid/i, "Esse email não parece válido."],
  [/rate limit|too many/i, "Muitas tentativas seguidas. Espere um minuto e tente de novo."],
  [/provider is not enabled|unsupported provider/i, "O login com Google ainda não foi ativado no Supabase."],
  [/failed to fetch|network/i, "Sem conexão com o servidor. Verifique a internet."]
];
const human = e => { const m = (e && (e.message || e.error_description)) || String(e || ""); for (const [re, t] of ERR) if (re.test(m)) return t; return m || "Algo deu errado. Tente de novo."; };

function shell(inner){ box.innerHTML = `<div class="auth-brand">${MARK}<span>Comunicador de Entregáveis</span></div>${inner}`; overlay.hidden = false; }
function say(t, err){ const m = $id("aMsg"); if (!m) return; m.textContent = t; m.className = "msg" + (err ? " err" : ""); m.hidden = !t; }
function busy(btn, on, label){ if (!btn) return; btn.disabled = on; if (label) btn.textContent = label; }

/* ---------- telas de login ---------- */
function showConfig(){
  shell(`<h1>Falta configurar</h1><p class="sub">Abra o arquivo <b>config.js</b> e cole a Project URL e a anon public key do seu projeto no Supabase. O passo a passo explica onde achar.</p>`);
}
function showLogin(){
  const signup = mode === "signup";
  shell(`
    <h1>${signup ? "Criar sua conta" : "Entrar"}</h1>
    <p class="sub">${signup ? "Use o email que o administrador liberou para você." : "Seus clientes e entregas ficam salvos na sua conta, em qualquer computador."}</p>
    <div class="auth-seg" role="tablist">
      <button type="button" id="aTabLogin" class="${signup ? "" : "on"}">Entrar</button>
      <button type="button" id="aTabSignup" class="${signup ? "on" : ""}">Criar conta</button>
    </div>
    <button type="button" class="ghost" id="aGoogle">${GOOGLE}Continuar com Google</button>
    <div class="or">ou com email</div>
    <form id="aForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      ${signup ? `<label>Seu nome<input id="aName" type="text" autocomplete="name" required></label>` : ""}
      <label>Email<input id="aEmail" type="email" autocomplete="email" required></label>
      <label>Senha<input id="aPass" type="password" autocomplete="${signup ? "new-password" : "current-password"}" minlength="6" required></label>
      <button type="submit" class="go" id="aSubmit">${signup ? "Criar conta" : "Entrar"}</button>
    </form>
    <div class="msg" id="aMsg" hidden></div>
    ${signup ? "" : `<button type="button" class="link" id="aForgot">Esqueci a senha</button>`}
  `);
  if (googleOn === false){ const g = $id("aGoogle"); if (g){ g.hidden = true; const o = g.nextElementSibling; if (o) o.hidden = true; } }
  $id("aTabLogin").onclick = () => { mode = "login"; showLogin(); };
  $id("aTabSignup").onclick = () => { mode = "signup"; showLogin(); };
  $id("aGoogle").onclick = async () => {
    say("");
    const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: here() } });
    if (error) say(human(error), true);
  };
  if ($id("aForgot")) $id("aForgot").onclick = showForgot;
  $id("aForm").onsubmit = async e => {
    e.preventDefault();
    const email = $id("aEmail").value.trim(), pass = $id("aPass").value;
    const name = signup ? $id("aName").value.trim() : "";
    if (signup && !name) return say("Coloque seu nome.", true);
    if (!email) return say("Coloque seu email.", true);
    if (pass.length < 6) return say("A senha precisa de pelo menos 6 caracteres.", true);
    const btn = $id("aSubmit"); busy(btn, true, signup ? "Criando..." : "Entrando..."); say("");
    try {
      if (signup){
        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name }, emailRedirectTo: here() } });
        if (error) throw error;
        if (!data.session){ busy(btn, false, "Criar conta"); return say("Conta criada. Confirme pelo link que chegou no seu email e depois entre."); }
        await enter(data.session);
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        await enter(data.session);
      }
    } catch (err){ busy(btn, false, signup ? "Criar conta" : "Entrar"); say(human(err), true); }
  };
}
function showForgot(){
  shell(`
    <h1>Trocar a senha</h1>
    <p class="sub">Mandamos um link para o seu email. Abra o link neste computador.</p>
    <form id="aForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <label>Email<input id="aEmail" type="email" autocomplete="email" required></label>
      <button type="submit" class="go" id="aSubmit">Enviar link</button>
    </form>
    <div class="msg" id="aMsg" hidden></div>
    <button type="button" class="link" id="aBack">Voltar</button>
  `);
  $id("aBack").onclick = () => { mode = "login"; showLogin(); };
  $id("aForm").onsubmit = async e => {
    e.preventDefault();
    const email = $id("aEmail").value.trim(); if (!email) return say("Coloque seu email.", true);
    const btn = $id("aSubmit"); busy(btn, true, "Enviando...");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here() });
    busy(btn, false, "Enviar link");
    if (error) say(human(error), true); else say("Pronto. Se esse email tiver conta, o link chega em instantes.");
  };
}
function showReset(){
  recovering.on = true;
  shell(`
    <h1>Nova senha</h1>
    <p class="sub">Escolha a senha que você vai usar daqui para frente.</p>
    <form id="aForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <label>Nova senha<input id="aPass" type="password" autocomplete="new-password" minlength="6" required></label>
      <button type="submit" class="go" id="aSubmit">Salvar e entrar</button>
    </form>
    <div class="msg" id="aMsg" hidden></div>
  `);
  $id("aForm").onsubmit = async e => {
    e.preventDefault();
    const pass = $id("aPass").value; if (pass.length < 6) return say("A senha precisa de pelo menos 6 caracteres.", true);
    const btn = $id("aSubmit"); busy(btn, true, "Salvando...");
    const { error } = await sb.auth.updateUser({ password: pass });
    if (error){ busy(btn, false, "Salvar e entrar"); return say(human(error), true); }
    recovering.on = false; history.replaceState(null, "", here());
    if (entered){ overlay.hidden = true; note("Senha trocada."); return; }
    const { data } = await sb.auth.getSession(); await enter(data.session);
  };
}
function showPending(){
  shell(`
    <h1>Quase lá</h1>
    <p class="sub">Sua conta foi criada, mas o administrador ainda não liberou este email:</p>
    <div class="who">${esc(me && me.email)}</div>
    <p class="sub">Peça para ele liberar. Depois clique em "Já fui liberado".</p>
    <button type="button" class="go" id="aRetry">Já fui liberado</button>
    <div class="msg" id="aMsg" hidden></div>
    <button type="button" class="link" id="aOut">Sair e usar outra conta</button>
  `);
  $id("aRetry").onclick = async () => { const { data } = await sb.auth.getSession(); entered = false; await enter(data.session, true); };
  $id("aOut").onclick = () => sb.auth.signOut().then(() => location.replace(here()));
}

/* ---------- entrar ---------- */
async function loadProfile(){
  const { data, error } = await sb.from("profiles").select("*").eq("id", me.id).maybeSingle();
  if (error) throw error;
  return data;
}
async function enter(session, retry){
  if (!session || entered || entering || recovering.on) return;
  entering = true;
  try {
    me = session.user;
    profile = await loadProfile();
    if (!profile || !profile.approved){ showPending(); if (retry) say("Ainda não foi liberado. Confira com o administrador.", true); return; }
    entered = true;
    overlay.hidden = true;
    if (/access_token|type=/.test(location.hash)) history.replaceState(null, "", here());
    installBridge();
    resolveReady();
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mountAccount); else mountAccount();
  } catch (e){
    shell(`<h1>Não consegui entrar</h1><p class="sub">${esc(human(e))}</p><button type="button" class="go" id="aRetry">Tentar de novo</button>`);
    $id("aRetry").onclick = () => location.reload();
  } finally { entering = false; }
}

/* ---------- ponte: mesma interface que o app usava no Claude ---------- */
function codeErr(code, msg){ const e = new Error(msg || code); e.code = code; return e; }
function note(t, later){ if (later) return setTimeout(() => note(t), 120); const el = document.getElementById("toast"); if (!el) return; el.textContent = t; el.hidden = false; clearTimeout(note.t); note.t = setTimeout(() => el.hidden = true, 3200); }

function installBridge(){
  const subs = new Set();
  let timer = null, channel = null;
  async function fetchAll(){
    const { data, error } = await sb.from("docs").select("id,data,owner");
    if (error) throw error;
    // Se um doc do administrador e um seu tiverem o mesmo id, o seu vence.
    const map = new Map();
    for (const r of data || []) if (r.owner !== me.id && !map.has(r.id)) map.set(r.id, r.data);
    for (const r of data || []) if (r.owner === me.id) map.set(r.id, r.data);
    const docs = [...map].map(([id, v]) => ({ id, exists: true, data: () => v, metadata: { fromCache: false, hasPendingWrites: false } }));
    return { docs, size: docs.length, empty: !docs.length };
  }
  async function push(){
    try { const snap = await fetchAll(); for (const s of subs) s.next(snap); }
    catch (e){ for (const s of subs) s.error && s.error(e); }
  }
  const schedule = () => { clearTimeout(timer); timer = setTimeout(push, 350); };
  function live(){
    if (channel) return;
    channel = sb.channel("docs-" + me.id).on("postgres_changes", { event: "*", schema: "public", table: "docs" }, schedule).subscribe();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) schedule(); });
  }
  const isShared = d => d && SHARED.includes(d.kind);
  const db = {
    collection(){
      return {
        doc(id){
          return {
            id,
            async set(body){
              if (isShared(body) && profile.role !== "admin"){ note("Só o administrador altera agentes, base e produtos.", true); schedule(); return; }
              const { error } = await sb.from("docs").upsert({ owner: me.id, id, data: body, updated_at: new Date().toISOString() }, { onConflict: "owner,id" });
              if (error){
                if (error.code === "42501"){ note("Sem permissão para salvar isso. Fale com o administrador.", true); schedule(); return; }
                if (/too large|payload/i.test(error.message || "")) throw codeErr("quota_exceeded");
                throw codeErr("write_failed", error.message);
              }
            },
            async delete(){
              if (/^(agent|kb|prod)-/.test(id) && profile.role !== "admin"){ note("Só o administrador altera agentes, base e produtos.", true); schedule(); return; }
              const { error } = await sb.from("docs").delete().eq("owner", me.id).eq("id", id);
              if (error) throw codeErr("write_failed", error.message);
              schedule();
            }
          };
        },
        onSnapshot(next, error){
          const s = { next, error }; subs.add(s); live(); push();
          return () => subs.delete(s);
        }
      };
    }
  };
  const user = { id: async () => me.id, me: async () => ({ id: me.id, name: profile.name }), isOwner: async () => profile.role === "admin", canEdit: async () => true, can: async () => true };

  async function prepImage(f){
    const type = f.type || "image/png";
    try {
      const bmp = await createImageBitmap(f);
      const k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.88));
      return { type: "image/jpeg", data: await b64(blob) };
    } catch { return { type, data: await b64(f) }; }
  }
  function b64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); }); }
  function parseJSON(t){
    let s = String(t || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
    try { return JSON.parse(s); } catch {}
    const a = s.indexOf("{"), b = s.lastIndexOf("}");
    if (a >= 0 && b > a){ try { return JSON.parse(s.slice(a, b + 1)); } catch {} }
    throw codeErr("invalid_json");
  }
  async function ask(prompt, opts){
    opts = opts || {};
    const images = opts.images && opts.images.length ? await Promise.all([...opts.images].slice(0, 5).map(prepImage)) : [];
    const { data } = await sb.auth.getSession();
    if (!data.session) throw codeErr("session_expired");
    let r;
    try {
      r = await fetch(CFG.supabaseUrl.replace(/\/$/, "") + "/functions/v1/" + (CFG.iaFunction || "ia"), {
        method: "POST", signal: opts.signal,
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + data.session.access_token, apikey: CFG.supabaseAnonKey },
        body: JSON.stringify({ prompt: typeof prompt === "string" ? prompt : JSON.stringify(prompt), images })
      });
    } catch (e){
      if (e && e.name === "AbortError") throw codeErr("cancelled");
      const err = codeErr("network");
      err.hint = "Não consegui falar com a função da IA no endereço /functions/v1/" + (CFG.iaFunction || "ia") + ". Confira se esse é o endereço da função no Supabase (Edge Functions).";
      throw err;
    }
    const out = await r.json().catch(() => ({}));
    if (!r.ok){
      const err = codeErr(out.code || (r.status === 401 ? "session_expired" : r.status === 429 ? "rate_limited" : r.status === 404 ? "no_function" : "network"));
      if (out.detail) err.hint = "Erro na função da IA: " + out.detail;
      throw err;
    }
    return out;
  }
  const sample = async (prompt, opts) => { const out = await ask(prompt, opts); return { text: out.text || "", truncated: !!out.truncated }; };
  sample.json = async (prompt, opts) => parseJSON((await ask(prompt, opts)).text);
  sample.limits = async () => ({ maxPromptBytes: 900000, images: { maxCount: 5, maxInputBytes: 20000000, mediaTypes: ["image/png", "image/jpeg", "image/webp", "image/gif"] } });

  window.claude = { use: async n => n === "db" ? db : n === "user" ? user : n === "sample" ? sample : null };

  // Fathom: conversa com a função "fathom" do Supabase (a chave do Fathom fica só lá).
  const fname = CFG.fathomFunction || "fathom";
  async function fcall(action, extra){
    const { data } = await sb.auth.getSession();
    if (!data.session) throw codeErr("session_expired");
    let r;
    try {
      r = await fetch(CFG.supabaseUrl.replace(/\/$/, "") + "/functions/v1/" + fname, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + data.session.access_token, apikey: CFG.supabaseAnonKey },
        body: JSON.stringify({ action, ...(extra || {}) })
      });
    } catch {
      const err = codeErr("fathom_function");
      err.hint = "Não consegui falar com a função do Fathom no endereço /functions/v1/" + fname + ". Confira o nome da função no Supabase e o fathomFunction no config.js.";
      throw err;
    }
    const out = await r.json().catch(() => ({}));
    if (!r.ok){
      const err = codeErr(out.code || (r.status === 404 ? "fathom_function" : "network"));
      if (out.detail) err.hint = "Erro na função do Fathom: " + out.detail;
      throw err;
    }
    return out;
  }
  window.MF_FATHOM = {
    status: () => fcall("status"),
    connect: (apiKey, email) => fcall("connect", { apiKey, email }),
    setEmail: email => fcall("email", { email }),
    disconnect: () => fcall("disconnect"),
    list: days => fcall("list", { days }),
    get: id => fcall("get", { id })
  };
}

/* ---------- menu da conta ---------- */
const initials = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?";
function mountAccount(){
  const bar = document.querySelector(".top-actions");

  const b = document.createElement("button");

  document.addEventListener("click", e => { if (!pop.hidden && !pop.contains(e.target) && e.target !== b) pop.hidden = true; });

}
function paintAccount(){
  const b = $id("btnAccount"); if (!b) return;

}

  const admin = profile.role === "admin";

  pop.hidden = false;

}
async function saveName(){
  const v = $id("acctName").value.trim(); if (!v) return note("O nome não pode ficar vazio.");
  const { error } = await sb.from("profiles").update({ name: v }).eq("id", me.id);
  if (error) return note("Não consegui salvar o nome.");
  profile.name = v; paintAccount(); pop.hidden = true; note("Nome atualizado.");
}
async function exportBackup(){
  const { data, error } = await sb.from("docs").select("id,data").eq("owner", me.id);
  if (error) return note("Não consegui gerar o backup. Tente de novo.");
  const docs = {}; for (const r of data || []) if (/^ce/.test(((r.data || {}).kind) || "")) docs[r.id] = r.data;
  const blob = new Blob([JSON.stringify({ app: "comunicador-entregaveis", versao: 1, exportadoEm: Date.now(), docs }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "backup-comunicador-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  pop.hidden = true; note(`Backup baixado com ${Object.keys(docs).length} itens.`);
}
fileIn.onchange = async () => {
  const f = fileIn.files && fileIn.files[0]; fileIn.value = ""; if (!f) return;
  let j; try { j = JSON.parse(await f.text()); } catch { return note("Esse arquivo não é um backup do Comunicador de Entregáveis."); }
  if (!j || j.app !== "comunicador-entregaveis" || !j.docs || typeof j.docs !== "object") return note("Esse arquivo não é um backup do Comunicador de Entregáveis.");
  const admin = profile.role === "admin";
  const all = Object.entries(j.docs).filter(([, v]) => v && typeof v === "object");
  const ok = all.filter(([, v]) => admin || !SHARED.includes(v.kind));
  const skipped = all.length - ok.length;
  if (!ok.length) return note("Nada para restaurar nesse arquivo.");
  if (!confirm(`Restaurar ${ok.length} itens na sua conta? Itens com o mesmo nome serão substituídos pela versão do arquivo.`)) return;
  const now = new Date().toISOString();
  for (let i = 0; i < ok.length; i += 20){
    const rows = ok.slice(i, i + 20).map(([id, data]) => ({ owner: me.id, id, data, updated_at: now }));
    const { error } = await sb.from("docs").upsert(rows, { onConflict: "owner,id" });
    if (error) return note("Parei no meio da restauração. Tente de novo.");
  }
  pop.hidden = true;
  note(`Backup restaurado: ${ok.length} itens.` + (skipped ? ` ${skipped} itens de agentes, base ou produtos ficaram de fora porque só o administrador altera.` : ""));
};

/* ---------- início ---------- */
async function start(){
  if (!CFG.supabaseUrl || /COLE_AQUI/.test(CFG.supabaseUrl + CFG.supabaseAnonKey) || !window.supabase){ showConfig(); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" } });
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "PASSWORD_RECOVERY"){ showReset(); return; }
    if (ev === "SIGNED_IN" && session && !entered) setTimeout(() => enter(session), 0);
  });
  if (recovering.on){ showReset(); return; }
  try {
    const r = await fetch(CFG.supabaseUrl.replace(/\/$/, "") + "/auth/v1/settings", { headers: { apikey: CFG.supabaseAnonKey } });
    if (r.ok){ const j = await r.json(); googleOn = !!(j && j.external && j.external.google); }
  } catch {}
  const { data } = await sb.auth.getSession();
  if (data.session) await enter(data.session); else showLogin();
}
start();
})();
</script>

const chains = {};

const loaded = {};
function loadScript(src){
  if (!loaded[src]) loaded[src] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error("lib")); }; document.head.append(s); });

async function readFileText(f){
  const n = f.name.toLowerCase(), ext = n.split(".").pop();
  if (["txt","md","markdown","csv","json","srt","vtt","html","htm"].includes(ext) || /^text\//.test(f.type)) return await f.text();
  const buf = await f.arrayBuffer();
  if (ext === "docx"){ await loadScript(LIBS.mammoth); const r = await window.mammoth.extractRawText({arrayBuffer:buf}); return r.value; }
  if (["xlsx","xls","ods"].includes(ext)){
    await loadScript(LIBS.xlsx); const wb = window.XLSX.read(buf, {type:"array"});
    return wb.SheetNames.map(s => `## Aba ${s}\n` + window.XLSX.utils.sheet_to_csv(wb.Sheets[s])).join("\n\n");
  }
  if (ext === "pptx"){
    await loadScript(LIBS.jszip); const zip = await window.JSZip.loadAsync(buf);
    const slides = Object.keys(zip.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a, b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]);
    const out = [];
    for (const k of slides){ const xml = await zip.file(k).async("string"); const t = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => m[1]).join(" "); out.push(`Slide ${out.length + 1}: ${t.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")}`); }
    return out.join("\n");
  }
  if (ext === "pdf"){
    await loadScript(LIBS.pdf); const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    const doc = await lib.getDocument({data:buf}).promise; const out = [];
    for (let p = 1; p <= doc.numPages; p++){ const pg = await doc.getPage(p); const tc = await pg.getTextContent(); out.push(tc.items.map(i => i.str).join(" ")); }
    return out.join("\n\n");
  }
  throw new Error("formato");
}

function msgSlots(c, n){

  let d = nextSlot(pend && pend > new Date() ? addBiz(pend, gap) : new Date());
  const out = [];

function planItems(c){
  const M = c.messages || [], D = c.deliverables || [], has = (type, did) => M.some(m => m.type === type && (!did || (m.dids || []).includes(did)));
  const items = [];
  if (!has("abertura")) items.push({type:"abertura", ids:[]});
  const doing = D.filter(d => d.status === "fazendo" && !has("bastidor", d.id));
  if (doing.length) items.push({type:"bastidor", ids:doing.slice(0, 4).map(d => d.id)});

    mut(cid, cc => { const x = findD(cc, did); x.steps = (x.steps || []).concat(passos.map(t => ({id:uid("s"), t, done:false}))); x.fast = x.fast || clean(o.atalho); x.auto = x.auto || clean(o.automatizar); x.proof = x.proof || clean(o.prova);
      if (+o.esforco_horas > 0) x.effort = clamp(Math.round(+o.esforco_horas * 2) / 2, 0.5, 80); if (+o.impacto) x.impact = clamp(Math.round(+o.impacto), 1, 3); }, `Passo a passo de "${d.title}" preenchido pela IA`);

}

function modalShell(title, sub, body, wide){

    h("div", {class:"modal" + (wide ? " wide" : ""), role:"dialog", "aria-modal":"true", "aria-labelledby":"mTitle"},
      h("div", {class:"panel-head"}, h("div", {}, h("h2", {id:"mTitle", text:title}), sub ? h("div", {class:"sub", text:sub}) : null),
        h("button", {class:"x", type:"button", "aria-label":"Fechar", onclick:closeModal}, icon(I.x))),

function templateLines(){
  const out = []; let ph = "";
  for (const raw of String(cfg().template || "").split("\n")){
    const l = raw.trim(); if (!l) continue;
    if (/:$/.test(l) && !/^[-*•]/.test(l)){ ph = l.slice(0, -1).trim(); continue; }
    const t = l.replace(/^[-*•]\s*/, "").trim(); if (t) out.push(ph ? `[${ph}] ${t}` : t);
  }
  return out;
}
function openNew(){
  const D = S.draft = {name:"", niche:"", product:"", startAt:ymd(new Date()), promisedAt:"", items:"", onboarding:"", files:[], tone:{}};

    h("button", {type:"button", "aria-label":"Remover arquivo", onclick:() => { D.files.splice(i, 1); drawFiles(); }, text:"×"}))));

  async function addFiles(list){

    onb, filesEl, h("div", {class:"row", style:"justify-content:center"}, h("button", {class:"btn sm", type:"button", id:"btnFiles", onclick:() => fileIn.click()}, icon(I.file, 2), "Anexar documentos")), fileIn,

    [["", "IA decide"], ...o].map(([v, l]) => h("button", {type:"button", style:"flex:1", "data-tone":k + ":" + v, "aria-pressed":String((D.tone[k] || "") === v), onclick:e => { D.tone[k] = v; for (const b of e.currentTarget.parentNode.children) b.setAttribute("aria-pressed", String(b === e.currentTarget)); }}, l))));
  const goAI = h("button", {class:"btn primary", type:"button", id:"btnPlan", onclick:() => create(true)}, icon(I.sparkle, 2), "Montar plano com IA");

  async function create(ai){
    err.hidden = true;

    if (!D.product.trim()){ err.textContent = "Diga o que você vendeu para ele."; err.hidden = false; $("#nProd").focus(); return; }
    if (!ai && !D.items.trim()){ err.textContent = "Sem IA, liste os entregáveis (um por linha)."; err.hidden = false; return; }

    }

      const dl = toDeliverables(out && out.entregaveis);
      if (!dl.length) throw {code:"invalid_json"};
      const cx = (out && out.contexto) || {}, tm = cx.tom || {};
      const tone = {};

  $("#modalRoot").replaceChildren(modalShell("Novo cliente", "O que você vendeu, o que prometeu e o que ele disse no onboarding.", [
    h("div", {class:"two"}, inp("nName", "Cliente", "name", "Ex.: Dra. Ana Souza"), inp("nNiche", "Nicho", "niche", "Ex.: psicologia clínica")),

    h("div", {class:"field"}, h("label", {class:"label", for:"nOnb", text:"Onboarding"}), drop),
    h("div", {class:"tone-row"}, h("div", {class:"label", text:"Tom do cliente"}), toneSeg),
    err, status,
    h("div", {class:"row"}, goMan, goAI),
    h("p", {class:"note", text:"A IA leva de 20 a 60 segundos. Ela não inventa entregável: tudo que ela acrescentar diz de onde tirou."})
  ], true));
  $("#nName").focus();
}
function openLate(cid){

  const btn = h("button", {class:"btn primary", type:"button", id:"btnLateGo", onclick:async () => {
    err.hidden = true;
    if (!dateIn.value || daysUntil(dateIn.value) < 0){ err.textContent = "Escolha uma nova data real, de hoje em diante."; err.hidden = false; return; }
    btn.disabled = true; S.busyModal = true; btn.replaceChildren(h("span", {class:"spin"}), "Escrevendo...");
    try {
      if (upd.checked) mut(cid, cc => { cc.promisedAt = dateIn.value; for (const d of cc.deliverables) if (isLateD(d)) d.dueAt = dateIn.value; }, `Nova data combinada: ${fmtDay(dateIn.value)}`);

    } catch (e){ S.busyModal = false; btn.disabled = false; btn.replaceChildren(icon(I.sparkle, 2), "Escrever mensagem"); err.textContent = sampleErr(e); err.hidden = false; }
  }}, icon(I.sparkle, 2), "Escrever mensagem");
  const done = (c.deliverables || []).filter(isDone).length;
  $("#modalRoot").replaceChildren(modalShell(`Atraso com ${c.name}`, "Honesta e firme: assume, mostra o que já foi feito e dá uma data que você vai cumprir.", [
    h("div", {class:"infobox"}, h("p", {text:`A mensagem vai citar só o que é real: ${done} entregável(is) pronto(s) e ${(c.deliverables || []).filter(d => d.status === "fazendo").length} em andamento. Mova no kanban o que já fez antes de gerar.`})),
    h("div", {class:"field"}, h("label", {class:"label", for:"lDate", text:"Nova data real"}), dateIn),
    h("label", {class:"check"}, upd, "Atualizar a data prometida e os prazos atrasados para essa data"),
    h("div", {class:"field"}, h("label", {class:"label", for:"lWhy", text:"Motivo"}), reason),
    err, h("div", {class:"row"}, btn)]));
}

/* ---------- atalhos ---------- */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#modalRoot").firstChild){ closeModal(); return; }
  if (S.sel) closeD();
});
setInterval(() => { if (!document.hidden && !S.sel && !$("#modalRoot").firstChild && !document.activeElement.matches("input,textarea,select")) render(); }, 60000);

/* ---------- início ---------- */
function banner(t){ const b = $("#banner"); b.textContent = t; b.hidden = !t; }
async function boot(){
  render();
  if (window.__authReady) await window.__authReady;
  const C = window.claude;
  if (!C || !C.use){ S.ready = true; banner("Entre na sua conta para salvar."); render(); return; }
  const [db, user, sample] = await Promise.all([C.use("db"), C.use("user"), C.use("sample")]);
  S.sample = sample;
  const id = user ? await user.id() : null;
  if (!db || !id){ S.ready = true; render(); return; }
  S.col = db.collection("data/users/" + id);
  S.col.onSnapshot(snap => {
    const cl = []; let st = null;
    for (const d of snap.docs){
      const v = d.data(); if (!v) continue;
      if (v.kind === "cesettings") st = v;
      else if (v.kind === "ceclient" && Array.isArray(v.deliverables)) cl.push({...clone(v), id:d.id});
    }
    cl.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.clients = cl; S.settings = st; S.ready = true;
    if (S.screen === "cliente" && !getClient(S.cur)) S.screen = "clientes";
    render();
  }, () => { S.ready = true; banner("Perdi a conexão com o banco. Recarregue a página."); render(); });
}
boot();
})();
