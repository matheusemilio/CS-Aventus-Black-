<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Comunicador de Entregáveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: infinite dot-grid canvas (Miro-like). Each client is a cluster: card -> return tag -> 5 follow nodes that open in place to show the message. Warm to cold, breakup in red. Queue rail left, detail drawer right. */
:root{
  --bg:#0A0A0B; --grid:rgba(255,255,255,.07); --surface:#131315; --surface-2:#1C1C1F; --line:#29292D;
  --fg:#F5F5F4; --muted:#8D8D93; --faint:#5A5A60;
  --accent:#F5F5F4; --accent-fg:#0A0A0B;
  --s1:#FF8A3D; --s2:#F2C14E; --s3:#35C7A5; --s4:#5B8CFF; --s5:#FF4D5E; --s6:#3CC4E0; --s7:#A78BFA; --ok:#3DD68C; --warn:#FF4D5E;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --font-ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F4F4F5; --grid:rgba(0,0,0,.085); --surface:#FFFFFF; --surface-2:#EFEFF1; --line:#E0E0E4;
  --fg:#0B0B0C; --muted:#64646B; --faint:#9C9CA3;
  --accent:#0B0B0C; --accent-fg:#FFFFFF;
  --s1:#E8691C; --s2:#C3950F; --s3:#109E7F; --s4:#2F6BEA; --s5:#E5243B; --s6:#0E8FAE; --s7:#7C5CE0; --ok:#14A35F; --warn:#E5243B;
  --shadow:0 10px 36px rgba(0,0,0,.1);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F4F4F5; --grid:rgba(0,0,0,.085); --surface:#FFFFFF; --surface-2:#EFEFF1; --line:#E0E0E4;
  --fg:#0B0B0C; --muted:#64646B; --faint:#9C9CA3;
  --accent:#0B0B0C; --accent-fg:#FFFFFF;
  --s1:#E8691C; --s2:#C3950F; --s3:#109E7F; --s4:#2F6BEA; --s5:#E5243B; --s6:#0E8FAE; --s7:#7C5CE0; --ok:#14A35F; --warn:#E5243B;
  --shadow:0 10px 36px rgba(0,0,0,.1);
  color-scheme:light;
}
/* Manual toggle inside the app: wins over the host theme (declared last, same specificity) */
:root[data-mode="light"]{
  --bg:#F4F4F5; --grid:rgba(0,0,0,.085); --surface:#FFFFFF; --surface-2:#EFEFF1; --line:#E0E0E4;
  --fg:#0B0B0C; --muted:#64646B; --faint:#9C9CA3;
  --accent:#0B0B0C; --accent-fg:#FFFFFF;
  --s1:#E8691C; --s2:#C3950F; --s3:#109E7F; --s4:#2F6BEA; --s5:#E5243B; --s6:#0E8FAE; --s7:#7C5CE0; --ok:#14A35F; --warn:#E5243B;
  --shadow:0 10px 36px rgba(0,0,0,.1);
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0A0A0B; --grid:rgba(255,255,255,.07); --surface:#131315; --surface-2:#1C1C1F; --line:#29292D;
  --fg:#F5F5F4; --muted:#8D8D93; --faint:#5A5A60;
  --accent:#F5F5F4; --accent-fg:#0A0A0B;
  --s1:#FF8A3D; --s2:#F2C14E; --s3:#35C7A5; --s4:#5B8CFF; --s5:#FF4D5E; --s6:#3CC4E0; --s7:#A78BFA; --ok:#3DD68C; --warn:#FF4D5E;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background-color .25s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--s4);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* Top bar */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:22px;height:22px;flex:none}
.stats{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surface-2);white-space:nowrap}
.stat b{font-family:var(--font-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.stat.is-alert b{color:var(--warn)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--warn)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px;gap:6px}
.btn.icon-only{width:36px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm svg{width:14px;height:14px}

/* Canvas */
.main{position:relative;overflow:hidden;min-height:0}
.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px)}
.viewport.is-panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;display:flex;gap:120px;align-items:flex-start;--k:1;--ik:1}
/* Colunas por dia da próxima ação. O zoom troca o nível de detalhe: longe = pílulas, médio = cards, perto = fluxo completo. */
.lane{flex:none;width:1000px}
.lane-head{zoom:var(--ik);width:calc(1000px * var(--k));display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.lane-head b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.lane-head span{font-size:12px;color:var(--muted);font-family:"Geist Mono",ui-monospace,monospace}
.lane.is-today .lane-head{border-bottom:2px solid var(--fg)}
.lane.is-late .lane-head b{color:var(--warn)}
.lane.is-ctr .lane-head b{color:var(--s6)}
.lane.is-won .lane-head b{color:var(--ok)}
.lane-head .lane-sum em{font-style:normal;font-weight:700;color:var(--fg)}
.lane.is-won .lane-head .lane-sum em{color:var(--ok)}
.mini .mval{margin-left:auto;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;font-weight:600;color:var(--fg)}
.mini .mval + small{margin-left:8px}
.cm-val{font-family:"Geist Mono",ui-monospace,monospace;font-size:15px;font-weight:600}
.lane.is-won .cm-val,.lane.is-won .mini .mval{color:var(--ok)}
.lane-body{display:flex;flex-direction:column;gap:64px}
.lane-empty{zoom:var(--ik);width:calc(1000px * var(--k));font-size:12px;color:var(--faint);padding:4px}
.mini,.cmid{display:none}
.world.z-far .lane-body,.world.z-mid .lane-body{gap:0}
.world.z-far .c-row,.world.z-far .edges,.world.z-mid .c-row,.world.z-mid .edges{display:none}
.world.z-far .cluster,.world.z-mid .cluster{padding:0}
.world.z-far .mini{display:flex}
.world.z-mid .cmid{display:flex}
.mini{zoom:var(--ik);width:calc(1000px * var(--k));align-items:center;gap:8px;padding:7px 12px;margin-bottom:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden}
.mini b{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:3.5em}
.mini small{margin-left:auto;color:var(--muted);font-family:"Geist Mono",ui-monospace,monospace;font-size:11px}
.cmid{zoom:var(--ik);width:calc(1000px * var(--k));max-width:440px;flex-direction:column;gap:6px;padding:12px 14px;margin-bottom:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.mini:hover,.cmid:hover{border-color:var(--muted)}
.cmid .cm-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cmid .cm-name{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmid .cm-meta{font-size:12px;color:var(--muted)}
.cmid .cm-next{font-size:12px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotrow{display:flex;gap:5px}
.dotrow i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:1}
.dotrow i.sent{opacity:.3}
.dotrow i.todo{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.dotrow i.cur{outline:2px solid var(--fg);outline-offset:1.5px}
.mdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.badge-s{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;flex:none}
.badge-s.late{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.badge-s.resp{color:var(--s4);background:color-mix(in srgb,var(--s4) 16%,transparent)}
.badge-s.human{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.badge-s.won{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.badge-s.lost{color:var(--muted);background:var(--surface-2)}
.cluster.is-late-c .mini,.cluster.is-late-c .cmid{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.cluster.is-resp .mini,.cluster.is-resp .cmid{border-color:color-mix(in srgb,var(--s4) 60%,var(--line))}
.world.anim{transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.cluster{position:relative;padding:8px 8px 8px 0}
.c-row{display:flex;align-items:center}
.cluster.is-dim{opacity:.22}
.cluster.is-closed .card,.cluster.is-closed .node,.cluster.is-closed .tag{filter:saturate(.25)}
.edges{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke-width:2}
.edges .e-base{stroke:var(--line)}
.edges .e-pend{stroke-dasharray:4 6;opacity:.75}

.card{flex:none;width:280px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-top-r{display:flex;align-items:center;gap:6px}
.card-name{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.15;overflow-wrap:anywhere}
.card-prod{color:var(--muted);font-size:13px;line-height:1.35}
.card-val{font-family:var(--font-mono);font-size:15px;font-variant-numeric:tabular-nums}
.card-next{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.card-next b{color:var(--fg);font-weight:600}
.fold{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.fold svg{width:14px;height:14px;transition:transform .25s}
.cluster.is-folded .fold svg{transform:rotate(-90deg)}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:2px}
.pip{height:5px;border-radius:3px;background:var(--surface-2)}
.pip.on{background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ativo{color:var(--s1)} .pill.contrato{color:var(--s6)} .pill.respondeu{color:var(--s4)} .pill.fechou{color:var(--ok)} .pill.perdido{color:var(--faint)} .pill.humano{color:var(--warn)}
.cluster.is-human .card{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 35%,transparent),var(--shadow)}
.node.is-skipped{opacity:.55}
.node.is-won{box-shadow:0 0 0 2px var(--ok),var(--shadow)}
.n-base{font-size:12px;line-height:1.45;color:var(--fg);background:color-mix(in srgb,var(--c) 12%,var(--surface-2));border-radius:10px;padding:8px 10px;margin:0}
.n-base b{font-weight:600;color:var(--c)}
.card-ctx{font-size:12px;line-height:1.4;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.card-ctx b{color:var(--fg);font-weight:600}
.ctx-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;white-space:nowrap}
.ctx-chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ctx-chip.no{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.exemplo{color:var(--muted);border:1px dashed var(--line);background:transparent}

.tag{flex:none;margin-left:44px;width:214px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;white-space:nowrap}
.tag small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tag b{font-family:var(--font-mono);font-weight:500;font-size:12px}
.nodes{flex:none;margin-left:64px;display:flex;flex-direction:column;gap:18px;width:360px}

.node{border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.12);transition:border-color .15s,box-shadow .2s}
.node:hover{border-color:var(--c)}
.n-head{width:100%;height:70px;padding:0 12px;border:0;background:transparent;display:flex;align-items:center;gap:12px;text-align:left;border-radius:16px}
.n-dot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1.5px solid var(--c)}
.n-dot svg{width:15px;height:15px}
.n-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.n-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.n-state{flex:none;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.n-chev{flex:none;width:16px;height:16px;color:var(--muted);transition:transform .25s}
.node.is-open .n-chev{transform:rotate(180deg)}
.node.is-sent{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.node.is-sent .n-dot{background:var(--c);color:var(--surface)}
.node.is-sent .n-state{color:var(--ok)}
.node.is-late .n-state,.node.is-now .n-state{color:var(--warn)}
.node.is-today .n-state{color:var(--c)}
.node.is-stopped{opacity:.5}
.node.is-current{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),0 2px 10px rgba(0,0,0,.12)}
.node.is-current .n-dot{animation:pulse 2.2s ease-in-out infinite}
.node.is-open{box-shadow:0 0 0 1px var(--c),var(--shadow)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.st1{--c:var(--s1)} .st2{--c:var(--s2)} .st3{--c:var(--s3)} .st4{--c:var(--s4)} .st5{--c:var(--s5)}

/* Opened message inside a node */
.n-open{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px;animation:unfold .3s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.n-why{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.n-text{white-space:pre-wrap;font-size:14.5px;line-height:1.6;padding:14px 16px;border-radius:14px;background:var(--surface-2);cursor:text;user-select:text;overflow-wrap:anywhere;margin:0}
.n-text.is-empty{color:var(--muted);font-style:italic}
.n-edit{width:100%;min-height:180px;resize:vertical;font-size:14.5px;line-height:1.6;padding:14px 16px;border-radius:14px;border:1.5px solid var(--c);background:var(--surface-2)}
.n-actions{display:flex;gap:6px;flex-wrap:wrap}
.n-actions .btn{flex:1 1 auto}

/* Tones */
.tones{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;border:1px dashed var(--line)}
.tones-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tones-head span{font-size:12px;color:var(--muted)}
.tone-chips{display:flex;flex-wrap:wrap;gap:6px}
.tone{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tone[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.segm.vmode{display:flex;margin-bottom:4px}
.vmode button{flex:1}
.var-angle{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.vars{display:flex;flex-direction:column;gap:10px}
.var{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.var-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line)}
.var-head b{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.var-head div{display:flex;gap:4px}
.var-text{white-space:pre-wrap;font-size:14px;line-height:1.55;padding:12px;margin:0;user-select:text;cursor:text;overflow-wrap:anywhere}
.var.is-used{border-color:var(--c)}

/* entry animation */
.cluster.enter .card{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.cluster.enter .tag{animation:pop .5s .15s cubic-bezier(.2,.8,.2,1) both}
.cluster.enter .node{animation:slide .5s cubic-bezier(.2,.8,.2,1) both}
.cluster.enter .edges path{stroke-dasharray:700;stroke-dashoffset:700;animation:draw .9s .2s ease forwards}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}

/* Ghost example + empty callout */
.cluster.ghost .card{border-style:dashed}
.empty{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(520px,calc(100% - 32px));padding:18px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;z-index:3}
.empty p{margin:0;color:var(--muted);line-height:1.45}
.empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:2px}

/* Bottom controls */
.zoom{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);z-index:3}
.zoom button{height:32px;min-width:32px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0 6px}
.zoom button:hover{background:var(--surface-2)}
.zoom svg{width:16px;height:16px}
.zoom output{font-family:var(--font-mono);font-size:12px;min-width:44px;text-align:center;color:var(--muted)}
.zoom .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.filters{position:absolute;left:16px;bottom:16px;display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);z-index:3;flex-wrap:wrap}
.main.has-drawer .zoom{right:404px}
.main.has-queue .filters{left:344px}
.filters button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}

/* Panels */
.panel{position:absolute;top:12px;bottom:12px;width:380px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);z-index:4;display:flex;flex-direction:column;overflow:hidden}
.drawer{right:12px}
.queue{left:12px;width:320px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 12px}
.panel-head h2{margin:0;font-size:18px;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.panel-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.panel-body{padding:4px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1}
.x{flex:none;width:32px;height:32px;border-radius:9px;border:0;background:var(--surface-2);display:grid;place-items:center}
.x svg{width:14px;height:14px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px}
.input,.area{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.area{resize:vertical;min-height:90px}
.area.msg{min-height:170px;font-size:15px}
.why{margin:0;line-height:1.5;color:var(--fg);font-size:13.5px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--s4)) 10%,var(--surface-2))}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:8px 4px;border-radius:9px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist li{display:flex;gap:10px}
.hist time{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);flex:none;width:86px;padding-top:1px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details pre{white-space:pre-wrap;font-family:var(--font-ui);font-size:13px;line-height:1.5;margin:8px 0 0;color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px}
.stepnav{display:flex;gap:6px}
.stepnav button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--c);background:transparent;color:var(--c);font-family:var(--font-mono);font-size:13px}
.stepnav button[aria-current="true"]{background:var(--c);color:var(--surface)}
.stepnav button.done{background:color-mix(in srgb,var(--c) 22%,transparent)}
.confirm{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
.confirm p{margin:0;font-size:13px}

.q-group{display:flex;flex-direction:column;gap:6px}
.q-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.q-item:hover{background:var(--surface-2)}
.q-item .n-dot{width:28px;height:28px;font-size:12px}
.q-item .q-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.q-item .q-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item .q-txt span{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.q-empty{color:var(--muted);font-size:13px;margin:0}

/* Modal */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal .panel-body{padding:6px 22px 22px}
.modal .panel-head{padding:22px 22px 10px}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop.is-over{border-color:var(--s4);color:var(--fg)}
.drop p{margin:0;font-size:13px;line-height:1.45}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1}
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.fchip{position:fixed;left:16px;bottom:16px;z-index:25;display:flex;align-items:center;gap:10px;max-width:min(420px,calc(100vw - 32px));padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;color:var(--muted)}
.fchip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.flist{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.frow .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.frow .t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .t span{font-size:12px;color:var(--muted)}
.frow .t .fnote{color:var(--faint)}
.fst{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.fst.criado{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.fst.ja_existe{color:var(--s4);background:color-mix(in srgb,var(--s4) 14%,transparent)}
.fimp{max-height:420px;overflow:auto}
.fimp .frow{cursor:pointer}
.fimp input{width:18px;height:18px;flex:none;accent-color:var(--fg)}
.fq{margin:0;font-size:13px;font-weight:600}
.fst.erro,.fst.excluido{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
@media (max-width:560px){.frow{flex-wrap:wrap}.frow .t{flex-basis:100%}}
/* ---------- meta: pop-up do ganho ---------- */
.gpop-ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);animation:gpFade .25s ease}
@keyframes gpFade{from{opacity:0}}
.gpop{--liq:#2fd27a;--liq2:#1fa860;position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:gpIn .45s cubic-bezier(.2,.9,.25,1.1);transition:background .5s,color .5s,border-color .5s}
@keyframes gpIn{from{opacity:0;transform:translateY(18px) scale(.96)}}
.gpop.t-blue{--liq:#3b82ff;--liq2:#2563eb}
.gpop.t-black{--liq:#111;--liq2:#000;background:#fff;color:#0b0b0b;border-color:#e6e6e6}
.gpop.t-black .gp-sub,.gpop.t-black .gp-meta,.gpop.t-black .gp-kicker{color:#555}
.gpop.t-black .btn{background:#f2f2f2;color:#0b0b0b;border-color:#ddd}
.gpop.t-black .btn.ghost{background:transparent}
.gp-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:inherit;display:grid;place-items:center;opacity:.7}
.gp-x:hover{opacity:1;background:color-mix(in srgb,currentColor 8%,transparent)}
.gp-x svg{width:18px;height:18px}
.gp-grid{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.gp-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.gp-kicker{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ok)}
.gpop.t-blue .gp-kicker{color:#3b82ff}
.gp-title{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.gp-sub{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.gp-big{font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.gp-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.gp-meta b{color:inherit;font-weight:700;font-family:var(--font-mono)}
.gpop .gp-meta b{color:var(--fg)}
.gpop.t-black .gp-meta b{color:#0b0b0b}
.gp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.gp-actions .btn{flex:1 1 auto}
.btn.gp-party{background:var(--liq);border-color:var(--liq);color:#fff;font-weight:700}
.gpop.t-green .btn.gp-party{color:#04150b}
.gpop.t-black .btn.gp-party{background:#0b0b0b;border-color:#0b0b0b;color:#fff}
.btn.gp-party:hover{filter:brightness(1.08)}
.gp-ins{margin-top:18px;padding-top:16px;border-top:1px solid color-mix(in srgb,currentColor 12%,transparent);display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5}
.gp-ins p{margin:0}
.gp-ins .gp-conta{font-weight:600}
.gp-ins ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.gp-ins li span{display:block}
.gp-ins li small{display:block;color:var(--muted);font-size:12px}
.gp-ins-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:520px){.gp-grid{grid-template-columns:1fr;justify-items:center;text-align:center}.gp-meta{justify-content:center}.gp-big{font-size:30px}}
/* frasco */
.flask{position:relative;width:92px;height:220px;display:flex;flex-direction:column;align-items:center}
.flask-neck{width:40px;height:22px;border:2px solid color-mix(in srgb,currentColor 35%,transparent);border-bottom:0;border-radius:8px 8px 0 0}
.flask-body{position:relative;flex:1;width:100%;border:2px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:20px 20px 30px 30px;overflow:hidden;background:color-mix(in srgb,currentColor 4%,transparent)}
.liquid{position:absolute;left:0;right:0;bottom:0;height:3%;background:linear-gradient(180deg,var(--liq),var(--liq2));transition:height 1.5s cubic-bezier(.22,.8,.2,1),background .6s}
.liquid .wave{position:absolute;left:0;top:-9px;width:200%;height:10px;fill:var(--liq);transition:fill .6s;animation:gpWave 2.4s linear infinite}
@keyframes gpWave{to{transform:translateX(-50%)}}
.gloss{position:absolute;top:10px;left:10px;width:10px;bottom:30px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.crack{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:color-mix(in srgb,currentColor 80%,transparent);stroke-width:1.6;stroke-linecap:round;opacity:0;pointer-events:none}
.crack path{stroke-dasharray:140;stroke-dashoffset:140}
.flask.broken{animation:gpShake .45s ease}
.flask.broken .crack{opacity:1}
.flask.broken .crack path{animation:gpDraw .5s ease forwards}
@keyframes gpShake{20%{transform:translateX(-4px) rotate(-2deg)}40%{transform:translateX(4px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes gpDraw{to{stroke-dashoffset:0}}
.drops{position:absolute;top:18px;left:50%;width:0;height:0}
.drops i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--liq);opacity:0}
.flask.broken .drops i{animation:gpDrop .9s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:calc(var(--i) * 40ms)}
.drops i:nth-child(1){--dx:-46px;--dy:-30px}.drops i:nth-child(2){--dx:-22px;--dy:-52px}.drops i:nth-child(3){--dx:4px;--dy:-60px}
.drops i:nth-child(4){--dx:26px;--dy:-48px}.drops i:nth-child(5){--dx:48px;--dy:-26px}.drops i:nth-child(6){--dx:-8px;--dy:-38px}
@keyframes gpDrop{0%{opacity:1;transform:translate(0,0) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 40px)) scale(.6)}}
/* confete */
.confe{position:fixed;z-index:80;pointer-events:none;opacity:0;animation:gpConfe 2s ease-out forwards;will-change:transform,opacity}
@keyframes gpConfe{0%{opacity:0;transform:translateY(10px) scale(.5) rotate(0)}18%{opacity:1;transform:translateY(0) scale(1.05) rotate(var(--r))}70%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(.95) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.liquid,.liquid .wave,.flask.broken,.confe{animation-duration:.01s!important;transition-duration:.2s!important}}
/* meta na tela de Progresso */
.goalbox{--liq:#2fd27a;margin-bottom:12px}
.goalbox.t-blue{--liq:#3b82ff}.goalbox.t-black{--liq:var(--fg)}
.gbar{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.gfill{height:100%;border-radius:999px;background:var(--liq);transition:width 1s cubic-bezier(.22,.8,.2,1)}
/* lane de perdidos e links */
.lane.is-lost .lane-head b{color:var(--muted)}
.lane.is-lost .cluster,.lane.is-lost .mini,.lane.is-lost .cmid{opacity:.72}
.flinks{display:flex;flex-direction:column;gap:4px}
.goalfs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.goalf{display:flex;flex-direction:column;gap:6px;min-width:0}
.goalf .label{display:flex;align-items:center;gap:7px}
.gdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
@media (max-width:720px){.goalfs{grid-template-columns:1fr}}

.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--fg);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.err{color:var(--warn);font-size:13px;margin:0;line-height:1.45}
.note{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;padding:9px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted);box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:13px;box-shadow:var(--shadow)}


/* ===== Screens: nav ===== */
.app{grid-template-rows:auto auto 1fr}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;position:relative;z-index:4}
.tabs button{border:0;background:transparent;padding:11px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
.tabs svg{width:15px;height:15px}
.view{position:relative;min-height:0;overflow:auto;background:var(--bg)}
.page{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.page.wide{max-width:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:22px;letter-spacing:-.02em}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.segm{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);gap:2px}
.segm button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.segm button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.segm svg{width:14px;height:14px}
.search{height:36px;width:220px;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:13px}
.select{height:40px;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:0 10px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.agent-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.blank{border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.blank b{color:var(--fg);font-size:15px}
.blank p{margin:0;font-size:13px;max-width:52ch;line-height:1.5}
/* Kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:none;width:250px;background:var(--surface-2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;border:1.5px dashed transparent;transition:border-color .15s}
.col.is-over{border-color:var(--c)}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 0;font-weight:600;font-size:13px}
.col-head i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.col-head span{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:500}
.col-sum{font-size:11.5px;color:var(--muted);padding:0 4px 4px;font-family:var(--font-mono)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.kcard:hover{border-color:var(--muted)}
.kcard.dragging{opacity:.4}
.k-move{height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-size:12px;padding:0 6px;color:var(--muted);margin-top:2px;width:100%}
.kcard b{font-size:14px;overflow-wrap:anywhere}
.k-sub{font-size:12px;color:var(--muted)}
.k-next{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.k-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.k-val{font-family:var(--font-mono);font-size:12.5px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.tg.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.tg.today{color:var(--s1);background:color-mix(in srgb,var(--s1) 13%,transparent)}
.tg.hot{color:var(--s1)} .tg.cold{color:var(--s4)} .tg.ok{color:var(--ok)}
.col-empty{font-size:12px;color:var(--faint);text-align:center;padding:16px 4px}
/* List */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td b{font-weight:600}
.stage{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.stage i{width:8px;height:8px;border-radius:50%;background:var(--c)}
/* Progress */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--font-mono);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{font-size:11.5px;color:var(--faint)}
.kpi.alert b{color:var(--warn)}
.kpi{min-width:0}
.kpi b{white-space:nowrap;min-width:0}
.kpi b.long{font-size:19px;letter-spacing:-.03em}
.kpi b.xl{font-size:16px;letter-spacing:-.03em}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h3{margin:0;font-size:14px}
.box .note{margin-top:-6px}
.hbar{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:12.5px}
.hbar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:var(--c)}
.hbar .v{font-family:var(--font-mono);text-align:right;color:var(--muted)}
.vchart{display:flex;flex-direction:column;gap:6px}
.vbars{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:150px;border-bottom:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 50%;background-position:0 0}
.vbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.vbar div{width:100%;max-width:24px;border-radius:5px 5px 0 0;background:var(--fg);min-height:2px}
.vbar.today div{background:var(--s1)}
.vbar span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);min-height:13px}
.vlabels{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--faint);text-align:center}
/* Settings */
.set-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.set-list{display:flex;flex-direction:column;gap:6px}
.set-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.set-item:hover{background:var(--surface-2)}
.set-item[aria-current="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.av{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.set-item .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.set-item .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-item .t span{font-size:12px;color:var(--muted)}
.kb-list{display:flex;flex-direction:column;gap:8px}
.kb-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.kb-item .t{flex:1;min-width:0}
.kb-item .t b{display:block;font-size:13.5px;overflow-wrap:anywhere}
.kb-item .t span{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.kb-item p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter div{height:100%;background:var(--fg)}

/* ===== Journey ===== */
.jsteps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.jsteps li{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--muted)}
.jsteps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:11.5px;font-family:var(--font-mono)}
.jsteps li.on{color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.jsteps li.on span{background:var(--accent);color:var(--accent-fg)}
.jsteps li.done{color:var(--ok)}
.jsteps li.done span{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.pastebox{align-items:stretch;text-align:left;padding:12px}
.paste-area{min-height:110px;background:var(--surface)}
.divisor{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.divisor-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.divisor-head b{font-size:14px}
.warnbox{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 9%,var(--surface-2));border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line))}
.warnbox p{margin:0;font-size:13px;line-height:1.45}
.infobox{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.infobox p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px}
.jbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.jbar div{display:flex;flex-direction:column;gap:5px;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
.jbar div::before{content:"";height:5px;border-radius:3px;background:var(--surface-2)}
.jbar div.done::before{background:var(--ok)}
.jbar div.on::before{background:var(--s1)}
.jbar div.on{color:var(--fg)}
.jbar div.bad::before{background:var(--warn)}
.ctx-list{display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.45}
.ctx-list b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
.ctx-list q{display:block;font-style:italic}

@media (max-width:720px){
  .jbar{grid-template-columns:repeat(5,minmax(0,1fr))}
  .set-grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .page-head h1{font-size:19px}
  .search{width:100%}
  .top{gap:10px;padding:10px 12px}
  .stats{order:3;flex-basis:100%}
  .top-actions .btn .lbl{display:none}
  .top-actions .btn{width:36px;padding:0}
  .panel{left:8px!important;right:8px;width:auto;top:auto;bottom:8px;max-height:72%}
  .filters{bottom:auto;top:12px;left:12px}
  .zoom{right:12px;bottom:12px}
  .main.has-drawer .zoom,.main.has-queue .zoom{display:none}
  .main.has-queue .filters{left:12px}
  .empty{flex-direction:column;align-items:stretch;bottom:68px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* Navegar no mapa não seleciona texto; só a mensagem e os campos continuam selecionáveis */
.viewport,.viewport *{-webkit-user-select:none;user-select:none}
.viewport .n-text,.viewport .var-text,.viewport input,.viewport textarea,.viewport [contenteditable]{-webkit-user-select:text;user-select:text}

[hidden]{display:none!important}
/* ---------- login e conta ---------- */
.auth{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px 16px;background:var(--bg);overflow:auto}
.auth[hidden]{display:none}
.auth-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.auth-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:10px}
.auth-brand svg{width:26px;height:26px}
.auth h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:700}
.auth p.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.auth-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.auth-seg button{height:34px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.auth-seg button.on{background:var(--surface-2);color:var(--fg)}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.auth input{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit;font-size:15px}
.auth input:focus{outline:2px solid var(--fg);outline-offset:1px}
.auth .go{height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:15px;cursor:pointer}
.auth .go:disabled{opacity:.5;cursor:default}
.auth .ghost{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.auth .ghost:hover{background:var(--surface-2)}
.auth .ghost svg{width:18px;height:18px}
.auth .or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px}
.auth .or::before,.auth .or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth .link{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px;align-self:center}
.auth .msg{font-size:13px;line-height:1.45;border-radius:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line)}
.auth .msg.err{border-color:var(--warn);color:var(--warn)}
.auth .msg[hidden]{display:none}
.auth .who{font-family:"Geist Mono",ui-monospace,monospace;font-size:13px;color:var(--fg)}

.acct-btn{gap:8px;padding:0 10px 0 6px}
.acct-av{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.acct-pop{position:fixed;top:60px;right:16px;z-index:150;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.acct-pop[hidden]{display:none}
.acct-pop .em{font-size:12px;color:var(--muted);word-break:break-all}
.acct-pop .role{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.acct-pop label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.acct-pop .row{display:flex;gap:8px}
.acct-pop input[type=text]{flex:1;min-width:0;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 10px;font:inherit;font-size:14px}
.acct-pop hr{border:0;border-top:1px solid var(--line);margin:0}
.acct-pop .full{width:100%;justify-content:flex-start}
.acct-pop .hint{font-size:12px;color:var(--faint);line-height:1.4;margin:0}

/* ===== Comunicador de Entregáveis ===== */
body{overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
.view{position:relative;min-height:0;overflow:auto;background:var(--bg)}
.brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.crumb button{border:0;background:transparent;color:var(--muted);padding:0;font-weight:600}
.crumb button:hover{color:var(--fg)}

/* entrada animada (cards em cascata) */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim-in .rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c,var(--s4)) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.kcard.just{animation:flash .9s ease-out}

/* cards de cliente */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.ccard:hover{border-color:var(--muted);transform:translateY(-1px)}
.ccard.late{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.ccard h3{margin:0;font-size:18px;letter-spacing:-.015em}
.ccard .sub{color:var(--muted);font-size:13px}
.pbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.pbar div{height:100%;border-radius:999px;background:var(--ok);transition:width 1s cubic-bezier(.22,.8,.2,1)}
.pbar div.s2{background:var(--s3)}
.prow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--font-mono)}

/* anel de progresso */
.ring{width:54px;height:54px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.22,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-weight:500}

.chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chead h1{margin:0;font-size:24px;letter-spacing:-.02em}
.chead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chead .grow{flex:1;min-width:200px}
.alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.alert p{margin:0;flex:1;min-width:220px;font-size:13.5px;line-height:1.45}
.alert b{color:var(--warn)}

/* kanban de entregáveis */
.board{scroll-snap-type:x proximity}
.col{width:280px;scroll-snap-align:start}
.kcard{gap:7px}
.kcard .k-title{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.urg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px}
.urg i{width:6px;height:6px;border-radius:50%;background:currentColor}
.urg.alta{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.urg.media{color:var(--s2);background:color-mix(in srgb,var(--s2) 15%,transparent)}
.urg.baixa{color:var(--muted);background:var(--surface-2)}
.kfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.kfoot .late{color:var(--warn);font-weight:600}
.minibar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.minibar div{height:100%;background:var(--c,var(--ok));transition:width .5s}
.quick{display:flex;gap:6px}
.quick input{flex:1;min-width:0;height:34px;border-radius:9px;border:1px dashed var(--line);background:var(--surface);padding:0 10px;font-size:13px}

/* hoje */
.cap{display:flex;flex-direction:column;gap:8px}
.cap .pbar{height:12px}
.cap .pbar div{background:var(--s1)}
.cap .pbar div.over{background:var(--warn)}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.trow.dim{opacity:.55}
.trow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.trow .t b{font-size:14px;overflow-wrap:anywhere}
.trow .t span{font-size:12px;color:var(--muted)}
.trow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--font-mono);font-size:12px;background:var(--surface-2)}
.tlist{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 0 2px}
.sechead h2{margin:0;font-size:16px;letter-spacing:-.01em}
.sechead span{font-size:12px;color:var(--muted)}

/* mensagens (linha do tempo) */
.timeline{display:flex;flex-direction:column;gap:14px;position:relative;max-width:760px}
.mcard{border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.mcard.sent{background:color-mix(in srgb,var(--c) 7%,var(--surface));opacity:.8}
.mcard.due{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mtype{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.mtype i{width:6px;height:6px;border-radius:50%;background:currentColor}
.mdate{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.mstate{margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mstate.now{color:var(--warn)} .mstate.ok{color:var(--ok)}
.mcard h3{margin:0;font-size:15px}
.mcard .n-text{font-size:14.5px}
.mcard .n-base b{color:var(--c)}
.mcard input[type=datetime-local]{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0 8px;font-size:12.5px}

/* checklist com animação */
.cl{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.cl.born{animation:clBorn .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes clBorn{0%{opacity:0;transform:scale(.9) translateY(8px)}60%{opacity:1}100%{transform:none}}
.cl.complete{border-color:color-mix(in srgb,var(--ok) 60%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 15%,transparent)}
.cl-head{display:flex;align-items:center;gap:10px}
.cl-head b{flex:1;font-size:14px}
.cl-head span{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.cl .minibar{margin:2px 0 4px}
.cli{display:flex;align-items:center;gap:10px;padding:5px 4px;border-radius:9px}
.cli:hover{background:var(--surface-2)}
.cli.born{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.ck{position:relative;width:22px;height:22px;flex:none;border:0;background:transparent;padding:0}
.ck svg{width:22px;height:22px;overflow:visible}
.ck .box{fill:transparent;stroke:var(--faint);stroke-width:1.8;transition:fill .25s,stroke .25s}
.ck .mark{fill:none;stroke:var(--accent-fg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20}
.cli.done .ck .box{fill:var(--ok);stroke:var(--ok)}
.cli.done .ck .mark{stroke-dashoffset:0;stroke:#fff}
.cli.pop .ck svg{animation:ckPop .45s cubic-bezier(.2,1.6,.4,1)}
.cli.pop .ck .mark{animation:ckDraw .35s .08s ease-out both}
@keyframes ckPop{0%{transform:scale(.6)}100%{transform:none}}
@keyframes ckDraw{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
.ck .spark{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--ok);opacity:0;pointer-events:none}
.cli.pop .ck .spark{animation:spark .55s ease-out forwards}
.ck .spark:nth-child(2){--dx:-14px;--dy:-10px}.ck .spark:nth-child(3){--dx:14px;--dy:-10px}.ck .spark:nth-child(4){--dx:-12px;--dy:12px}.ck .spark:nth-child(5){--dx:12px;--dy:12px}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.cli-t{flex:1;position:relative;font-size:13.5px;line-height:1.4;overflow-wrap:anywhere;transition:color .3s}
.cli-t::after{content:"";position:absolute;left:0;top:52%;height:1.5px;width:0;background:var(--muted);transition:width .35s ease}
.cli.done .cli-t{color:var(--muted)}
.cli.done .cli-t::after{width:100%}
.cli .del{opacity:0;border:0;background:transparent;color:var(--faint);width:24px;height:24px;border-radius:6px;display:grid;place-items:center;padding:0}
.cli:hover .del,.cli .del:focus-visible{opacity:1}
.cli .del svg{width:13px;height:13px}
.cl-add{height:32px;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:0 4px;font-size:13px;width:100%}
.cl-add:focus{outline:0;border-bottom-color:var(--fg)}

/* composer com /checklist */
.composer{position:relative}
.composer input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:14px}
.slash{position:absolute;left:0;top:calc(100% + 6px);z-index:5;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;animation:rise .2s ease both}
.slash button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:var(--surface-2);border-radius:8px;padding:9px 10px;text-align:left}
.slash button b{font-family:var(--font-mono);font-weight:500}
.slash button span{color:var(--muted);font-size:12.5px}
.blocks{display:flex;flex-direction:column;gap:10px}
.note-b{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;line-height:1.5;white-space:pre-wrap;display:flex;gap:8px;align-items:flex-start}
.note-b p{margin:0;flex:1;overflow-wrap:anywhere}
.note-b.born{animation:rise .35s ease both}

/* gaveta do entregável */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet.enter{animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
.sheet .panel-body{overflow:auto;flex:1;min-height:0}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .panel-body{padding:4px 20px 28px}
.sheet .panel-head{padding:18px 20px 10px}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.35)}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg4 button{border:0;background:transparent;padding:8px 2px;border-radius:9px;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.2}
.seg4 button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tip{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--c) 9%,var(--surface-2))}
.tip .label{color:var(--c);margin:0}
.tip textarea{border:0;background:transparent;padding:0;resize:vertical;min-height:44px;font-size:13.5px;line-height:1.5;width:100%}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--fg)}

/* modal grande */
.modal.wide{width:min(760px,100%)}
.tone-row{display:flex;flex-direction:column;gap:6px}
.files{display:flex;gap:6px;flex-wrap:wrap}
.fileb{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-size:12px}
.fileb button{border:0;background:transparent;padding:0;color:var(--muted)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface-2),color-mix(in srgb,var(--fg) 8%,var(--surface-2)),var(--surface-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}

.steps-gen{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;border:1px solid var(--line)}
